name: Python CI

on:
  push:

jobs:
  ci:
    uses: RWTH-EBC/ci_templates/.github/workflows/ci_pipeline.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYPI_PASSWORD: ${{ secrets.PYPI_TOKEN }}
    with:
      PYTHON_VERSION: "3.12"
      PYTHON_TEST_MATRIX: '["3.11", "3.12", "3.13", "3.14"]'
      PYTHON_PACKAGE_NAME: 'districtgenerator'
      USE_PYLINT: true
      USE_RUFF: true
      BUILD_PACKAGE: true
      EXECUTE_TESTS: true
      EXECUTE_COVERAGE_TEST: true
      PYPI_RELEASE: true