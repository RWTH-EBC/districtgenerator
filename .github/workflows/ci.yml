name: Python CI

on:
  push:

jobs:
  ci:
    uses: RWTH-EBC/ci_templates/.github/workflows/ci_pipeline.yml@main
  secrets:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  with:
    PYTHON_VERSION: "3.10"
    USE_PYLINT: true
    USE_RUFF: true
    BUILD_PACKAGE: true
    GENERATE_DOCUMENTATION: true
    GH_PAGES: true
    EXECUTE_TESTS: true
    EXECUTE_COVERAGE_TEST: true
    PYPI_RELEASE: true